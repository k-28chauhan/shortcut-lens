name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install pinned Python (.python-version)
        run: uv python install

      - name: Sync dependencies (CPU)
        run: uv sync --extra cpu

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy src/shortcut_lens

      - name: Import-linter (group-label firewall)
        run: uv run lint-imports

      - name: Fast tests
        run: uv run pytest -m "not slow and not gpu and not network"
