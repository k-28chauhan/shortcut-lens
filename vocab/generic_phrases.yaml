# FROZEN — generic phrase vocabulary for the `vocab` namer (see PRD FR-N1, FR-N2; DECISIONS D-012).
# Written before any results exist. Do not edit without a DECISIONS entry and human approval.
# The `no_artifacts` variant drops the categories listed in `artifact_categories`.

templates:
  - "a photo with {phrase}."
  - "a photo of a {classname} with {phrase}."
  - "a picture showing {phrase}."

artifact_categories: [artifacts, colors]

